<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background: #090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Animated Ambient Glow 1 -->
    <radialGradient id="glowLeft" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35">
        <animate attributeName="stop-opacity" values="0.35;0.6;0.35" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>

    <!-- Animated Ambient Glow 2 -->
    <radialGradient id="glowRight" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3">
        <animate attributeName="stop-opacity" values="0.3;0.55;0.3" dur="7s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>

    <!-- Animated Ambient Glow 3 -->
    <radialGradient id="glowCenter" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2">
        <animate attributeName="stop-opacity" values="0.15;0.35;0.15" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Badge / Wave Gradients -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Pill Gradient 1 -->
    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Pill Gradient 2 -->
    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.2"/>
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatMedium {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-14px) rotate(1.5deg); }
    }
    @keyframes pulseOrb {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.15); }
    }
    @keyframes dashCycle {
      0% { stroke-dashoffset: 1200; }
      100% { stroke-dashoffset: 0; }
    }
    .floating-pill-1 {
      animation: floatSlow 7s ease-in-out infinite;
    }
    .floating-pill-2 {
      animation: floatMedium 8.5s ease-in-out infinite;
    }
    .floating-pill-3 {
      animation: floatSlow 6.2s ease-in-out infinite reverse;
    }
    .timeline-stroke {
      stroke-dasharray: 600;
      animation: dashCycle 12s linear infinite;
    }
  </style>

  <!-- 1. Background Layers -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#glowLeft)"/>
  <rect width="1200" height="360" fill="url(#glowRight)"/>
  <rect width="1200" height="360" fill="url(#glowCenter)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>

  <!-- 2. Dynamic Motion Graphics Waves in the Background (Behind text) -->
  <g opacity="0.45">
    <!-- Sine/Easing Curve 1 -->
    <path class="timeline-stroke" d="M -50,280 C 200,340 350,180 600,260 C 850,340 1000,190 1250,270" fill="none" stroke="url(#waveGrad)" stroke-width="2.5"/>
    <!-- Sine/Easing Curve 2 -->
    <path class="timeline-stroke" d="M -50,90 C 250,30 400,160 650,80 C 900,0 1050,140 1250,70" fill="none" stroke="url(#waveGrad)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 3. Animated Particles / Orbs in Deep Background Corners -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="4" fill="#38bdf8">
      <animate attributeName="cy" values="80;70;80" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1080" cy="110" r="5" fill="#ec4899">
      <animate attributeName="cy" values="110;125;110" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="1120" cy="270" r="3.5" fill="#a855f7">
      <animate attributeName="cy" values="270;255;270" dur="4.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="290" r="4.5" fill="#06b6d4">
      <animate attributeName="cy" values="290;305;290" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 4. Background Decorative Tech Pills (Safely placed in perimeter corners, NEVER overlapping center text) -->
  <g class="floating-pill-1" transform="translate(60, 48)">
    <rect width="130" height="32" rx="16" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#38bdf8"/>
    <text x="28" y="20" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="0.5">60 FPS WAAPI</text>
  </g>

  <g class="floating-pill-2" transform="translate(1010, 48)">
    <rect width="130" height="32" rx="16" fill="url(#pillGrad2)" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#ec4899"/>
    <text x="28" y="20" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="0.5">SPRING PHYSICS</text>
  </g>

  <g class="floating-pill-3" transform="translate(60, 280)">
    <rect width="140" height="32" rx="16" fill="url(#pillGrad2)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#a855f7"/>
    <text x="28" y="20" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="0.5">LOTTIE &amp; RIVE</text>
  </g>

  <g class="floating-pill-1" transform="translate(1000, 280)">
    <rect width="140" height="32" rx="16" fill="url(#pillGrad1)" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#06b6d4"/>
    <text x="28" y="20" fill="#cbd5e1" font-size="11" font-weight="600" letter-spacing="0.5">STATE MACHINES</text>
  </g>

  <!-- 5. Central Foreground Text Content (Crisp, High Contrast, Guaranteed Foreground Visibility) -->
  <g id="foreground-content" filter="url(#shadow)">
    <!-- Top Category Tag -->
    <g transform="translate(600, 92)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM ⚡</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" fill="url(#titleGrad)" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Web Animation Libraries
    </text>

    <!-- Subtitle -->
    <text x="600" y="210" text-anchor="middle" fill="#94a3b8" font-size="17" font-weight="500" letter-spacing="0.2">
      Production-Grade Motion Engines, UI Transitions, Physics Springs &amp; State Machines
    </text>

    <!-- Metrics / Key Highlights Bar -->
    <g transform="translate(600, 256)">
      <rect x="-260" y="-16" width="520" height="32" rx="8" fill="#0f172a" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="500">
        <tspan fill="#38bdf8" font-weight="700">★ 20+ Open-Source Engines</tspan>
        <tspan fill="#64748b">  |  </tspan>
        <tspan fill="#a855f7" font-weight="700">🏢 8 Top SaaS Platforms</tspan>
        <tspan fill="#64748b">  |  </tspan>
        <tspan fill="#34d399" font-weight="700">🚀 60 FPS Performance</tspan>
      </text>
    </g>
  </g>
</svg>
